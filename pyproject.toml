[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wholeboard"
version = "0.1.0"
description = "AI PCB design workbench: describe a board, get it designed in KiCad, routed by TraceMaker and quoted at JLCPCB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)"]
dependencies = [
  "anthropic>=1.17",
  "openai>=1.40",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "reportlab>=4.0",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "mkdocs-gen-files>=0.5"]

[project.scripts]
wholeboard = "wholeboard.__main__:main"

[tool.setuptools.packages.find]
include = ["wholeboard*"]

[tool.setuptools.package-data]
wholeboard = ["web/*", "jlc/pricing.json"]
